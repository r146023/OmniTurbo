name: Prepare 0.1.2 once

on:
  push:
    branches:
      - work/release-hardening-0001
    paths:
      - .github/.prepare-0.1.2-once

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/release-hardening-0001
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Reconstruct exact current graph
        run: npm ci
      - name: Set patch release version and synchronize lock metadata
        shell: bash
        run: |
          npm version 0.1.2 --no-git-tag-version
          npm install --package-lock-only --ignore-scripts
      - name: Restrict versioning delta
        shell: bash
        run: |
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED=$'package-lock.json\npackage.json'
          printf 'Changed paths:\n%s\n' "$CHANGED"
          test "$CHANGED" = "$EXPECTED"
          test "$(node -p "require('./package.json').version")" = "0.1.2"
          test "$(node -p "require('./package-lock.json').version")" = "0.1.2"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.1.2"
          test "$(node -p "require('./package.json').engines.node")" = ">=22"
          test "$(node -p "require('./package-lock.json').packages[''].engines.node")" = ">=22"
      - name: Prove release graph reconstructs
        run: npm ci
      - name: Audit release graph
        run: npm audit --audit-level=high
      - name: Verify exact 0.1.2 package candidate
        run: npm run verify
      - name: Commit release version only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          test "$(git diff --cached --name-only | sort)" = $'package-lock.json\npackage.json'
          git commit -m "Prepare OmniTurbo 0.1.2 release candidate"
          git push origin HEAD:work/release-hardening-0001
