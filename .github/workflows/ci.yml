name: CI

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact dependency graph
        run: npm ci
      - name: Audit production/package graph
        run: npm audit --audit-level=high
      - name: Verify source, build, and packed consumer
        run: npm run verify
