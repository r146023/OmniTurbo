name: CI

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact dependency graph
        run: npm ci
      - name: Audit full and production dependency graphs with strict v0.1.3 exception guard
        run: node scripts/verify-audit-gate.mjs
      - name: Preserve full audit reports in CI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-node-${{ matrix.node }}
          path: .release-audit/
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify source, build, and packed consumer
        run: npm run verify
