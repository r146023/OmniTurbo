name: Rewrite ESM specifiers once

on:
  push:
    branches:
      - work/release-hardening-0001
    paths:
      - .github/.rewrite-esm-once

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/release-hardening-0001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Append .js to relative ESM specifiers
        shell: python
        run: |
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'((?:from|import)\s+["\'])(\.\.?/[^"\']+)(["\'])'),
              re.compile(r'(import\(\s*["\'])(\.\.?/[^"\']+)(["\']\s*\))'),
          ]
          explicit = ('.js', '.mjs', '.cjs', '.json', '.node')

          changed = []
          for path in Path('src').rglob('*.ts'):
              before = path.read_text(encoding='utf-8')
              after = before
              for pattern in patterns:
                  def replace(match):
                      spec = match.group(2)
                      if spec.endswith(explicit):
                          return match.group(0)
                      return f'{match.group(1)}{spec}.js{match.group(3)}'
                  after = pattern.sub(replace, after)
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No ESM specifiers changed')
          print('\n'.join(changed))
      - name: NodeNext must resolve every source import
        run: npm run typecheck
      - name: Commit mechanical source migration only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -v '^src/.*\.ts$'; then
            echo 'Unexpected path changed by ESM migration' >&2
            exit 1
          fi
          git commit -m "Make emitted ESM specifiers native-Node compatible"
          git push origin HEAD:work/release-hardening-0001
